resolver 127.0.0.11 valid=10s ipv6=off;
upstream radar_api {
    zone radar_api 64k;
    server fastapi_api:8005 resolve;
}
upstream radar_frontend {
    zone radar_frontend 64k;
    server frontend:3000 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# A local TLS reverse proxy may pass https. The published socket remains loopback-only.
map $http_x_forwarded_proto $radar_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        proxy_pass http://radar_api/health/ready;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $radar_forwarded_proto;
    }
    location /api/v1/ {
        proxy_pass http://radar_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Discard any client-supplied forwarding chain at this gateway.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $radar_forwarded_proto;
    }
    location /ws/ {
        proxy_pass http://radar_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $radar_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://radar_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $radar_forwarded_proto;
    }
}
