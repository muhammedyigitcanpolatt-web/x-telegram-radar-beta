resolver 127.0.0.11 valid=10s ipv6=off;
upstream radar_api {
    zone radar_api 64k;
    server fastapi_api:8005 resolve;
}
upstream radar_frontend {
    zone radar_frontend 64k;
    server frontend:3000 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# The Compose entrypoint supplies the host peer, deployment mode, and edge
# secret. Only the authenticated host TLS edge may supply public client IPs.
map $remote_addr $radar_from_host {
    default 0;
    ${RADAR_HOST_GATEWAY_IP} 1;
}

map $http_x_radar_edge_secret $radar_edge_authorized {
    default 0;
    ~^${RADAR_EDGE_SHARED_SECRET}$ 1;
}

map "${RADAR_PUBLIC_HTTPS}:$radar_from_host:$radar_edge_authorized:$http_x_forwarded_proto" $radar_forwarded_proto {
    default $scheme;
    "1:1:1:https" https;
}

# The host TLS edge must replace X-Forwarded-For with one client IP literal.
# Invalid or unauthenticated public identity fails closed at the API.
# Local HTTP ignores all forwarded identity headers.
map "${RADAR_PUBLIC_HTTPS}:$radar_from_host:$radar_edge_authorized:$http_x_forwarded_proto:$http_x_forwarded_for" $radar_client_ip {
    default $remote_addr;
    ~*^1:1:1:https:([0-9A-Fa-f:.]+)$ $1;
    ~^1: "";
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        proxy_pass http://radar_api/health/ready;
        proxy_set_header Host $http_host;
        proxy_set_header X-Radar-Edge-Secret "";
        proxy_set_header X-Forwarded-Proto $radar_forwarded_proto;
    }
    location /api/v1/ {
        proxy_pass http://radar_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $radar_client_ip;
        # Never pass an unsanitized forwarding chain to the API.
        proxy_set_header X-Forwarded-For $radar_client_ip;
        proxy_set_header X-Forwarded-Proto $radar_forwarded_proto;
        proxy_set_header X-Radar-Edge-Secret "";
    }
    location /ws/ {
        proxy_pass http://radar_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $radar_client_ip;
        proxy_set_header X-Forwarded-For $radar_client_ip;
        proxy_set_header X-Forwarded-Proto $radar_forwarded_proto;
        proxy_set_header X-Radar-Edge-Secret "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://radar_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $radar_client_ip;
        proxy_set_header X-Forwarded-Proto $radar_forwarded_proto;
        proxy_set_header X-Radar-Edge-Secret "";
    }
}
